  <body>
    <p id="offline-banner" class="status-banner offline" role="status" hidden>Offline. Changes sync when you reconnect.</p>
    <a id="update-banner" class="status-banner update" hidden></a>
    <p id="news-banner" class="status-banner news" hidden><span></span><button type="button" aria-label="Close">×</button></p>
    <a id="rules-banner" class="status-banner update" href="https://huskerthecat.github.io/FTC_Ultimate_Inventory/setup.html#updating-the-rules" target="_blank" rel="noopener" hidden>Firebase rules out of date. How to update →</a>
    <a id="open-rules-banner" class="status-banner danger" href="https://huskerthecat.github.io/FTC_Ultimate_Inventory/setup.html#updating-the-rules" target="_blank" rel="noopener" hidden>Your Firebase isn’t secure. How to fix →</a>
    <a id="demo-banner" class="status-banner demo" href="index.html" hidden>Demo only. <u>Set up your team →</u></a>
    <!-- Grey placeholders until the app's code has drawn its first screen; public/first-screen.js picks which one shows.
         The inventory one is also the loading screen src/main.js shows while signing in (renderLoading). -->
    <div id="app">
      <main class="center first-card" aria-busy="true" aria-label="Loading">
        <div class="skeleton title"></div>
        <div class="card">
          <div class="skeleton field"></div>
          <div class="skeleton field"></div>
          <div class="skeleton field"></div>
        </div>
      </main>
      <main class="first-inventory" aria-busy="true" aria-label="Loading inventory">
          <header>
            <div class="lockup">
        <div class="menuwrap">
        <button id="apps-toggle" aria-label="FTC Ultimate apps" title="FTC Ultimate apps" aria-haspopup="true" aria-expanded="false" aria-controls="apps-menu"><svg class="app-icon cube" viewBox="0 0 512 512" aria-hidden="true">
        <defs><linearGradient id="cube-navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f2640"></stop><stop offset="1" stop-color="#0e1221"></stop></linearGradient></defs>
        <rect width="512" height="512" rx="112" fill="url(#cube-navy)"></rect>
        <g class="layer" data-show="inventory"><g class="top"><path d="M256.0 89.2 L369.5 154.7 L256.0 220.2 L142.5 154.7 Z" fill="#eef1f8" stroke="#eef1f8" stroke-width="32" stroke-linejoin="round"></path></g><g class="left"><path d="M111.5 208.4 L225.0 273.9 L225.0 404.9 L111.5 339.4 Z" fill="#5aa9ff" stroke="#5aa9ff" stroke-width="32" stroke-linejoin="round"></path></g><g class="right"><path d="M287.0 273.9 L400.5 208.4 L400.5 339.4 L287.0 404.9 Z" fill="#2f5bd6" stroke="#2f5bd6" stroke-width="32" stroke-linejoin="round"></path><path class="glyph" d="M298.3 298.8 L389.1 246.4 L389.1 267.4 L298.3 319.8 Z M305.2 315.8 L305.2 378.7 L382.3 334.2 L382.3 271.3 M330.1 319.8 L357.4 304.0 L357.4 322.4 L330.1 338.1 Z" fill="none" stroke="#1a2a6c" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"></path></g></g>
      </svg><svg class="chevron" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      </div>
        <h1 class="brand"><span class="name"><span class="skeleton team-name"></span></span><span class="app-name">Inventory</span></h1>
      </div>
            <div class="row">
              <button class="secondary" disabled=""><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"></path></svg><span>Scan</span></button>
              <button class="icon" disabled="" aria-label="Menu"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
            </div>
          </header>
          <div class="projectpick">
            <div class="projectmenu"><button id="project" class="secondary" disabled=""><span class="skeleton"></span></button></div>
          </div>
          <div class="toolbar">
            <input type="search" placeholder="Search parts…" disabled="">
            <button class="secondary" disabled=""><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg><span>Filters</span></button>
            <button class="icon" disabled="" aria-label="More"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg></button>
            <button disabled=""><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span>Add part</span></button>
          </div>
          <table>
            <thead><tr><th>Item</th><th>Part #</th><th>Qty</th><th>In use</th><th>Location</th><th>Supplier</th><th>Category</th></tr></thead>
            <tbody>
        <tr class="loading" aria-hidden="true">
          <td class="name"><div class="with-photo">
            <div class="skeleton row-photo"></div>
            <div><div class="skeleton line" style="width: 70%"></div><div class="tags"><div class="skeleton pill"></div><div class="skeleton pill"></div></div></div>
          </div></td>
          <td data-label="Part #"><div class="skeleton"></div></td>
          <td data-label="Qty" class="qty"><div class="skeleton"></div></td>
          <td data-label="In use"><div class="skeleton"></div></td>
          <td data-label="Location"><div class="skeleton"></div></td>
          <td data-label="Supplier"><div class="skeleton"></div></td>
          <td data-label="Category"><div class="skeleton"></div></td>
        </tr>
        <tr class="loading" aria-hidden="true">
          <td class="name"><div class="with-photo">
            <div class="skeleton row-photo"></div>
            <div><div class="skeleton line" style="width: 45%"></div><div class="tags"><div class="skeleton pill"></div><div class="skeleton pill"></div></div></div>
          </div></td>
          <td data-label="Part #"><div class="skeleton"></div></td>
          <td data-label="Qty" class="qty"><div class="skeleton"></div></td>
          <td data-label="In use"><div class="skeleton"></div></td>
          <td data-label="Location"><div class="skeleton"></div></td>
          <td data-label="Supplier"><div class="skeleton"></div></td>
          <td data-label="Category"><div class="skeleton"></div></td>
        </tr>
        <tr class="loading" aria-hidden="true">
          <td class="name"><div class="with-photo">
            <div class="skeleton row-photo"></div>
            <div><div class="skeleton line" style="width: 60%"></div><div class="tags"><div class="skeleton pill"></div><div class="skeleton pill"></div></div></div>
          </div></td>
          <td data-label="Part #"><div class="skeleton"></div></td>
          <td data-label="Qty" class="qty"><div class="skeleton"></div></td>
          <td data-label="In use"><div class="skeleton"></div></td>
          <td data-label="Location"><div class="skeleton"></div></td>
          <td data-label="Supplier"><div class="skeleton"></div></td>
          <td data-label="Category"><div class="skeleton"></div></td>
        </tr>
        <tr class="loading" aria-hidden="true">
          <td class="name"><div class="with-photo">
            <div class="skeleton row-photo"></div>
            <div><div class="skeleton line" style="width: 80%"></div><div class="tags"><div class="skeleton pill"></div><div class="skeleton pill"></div></div></div>
          </div></td>
          <td data-label="Part #"><div class="skeleton"></div></td>
          <td data-label="Qty" class="qty"><div class="skeleton"></div></td>
          <td data-label="In use"><div class="skeleton"></div></td>
          <td data-label="Location"><div class="skeleton"></div></td>
          <td data-label="Supplier"><div class="skeleton"></div></td>
          <td data-label="Category"><div class="skeleton"></div></td>
        </tr>
        <tr class="loading" aria-hidden="true">
          <td class="name"><div class="with-photo">
            <div class="skeleton row-photo"></div>
            <div><div class="skeleton line" style="width: 50%"></div><div class="tags"><div class="skeleton pill"></div><div class="skeleton pill"></div></div></div>
          </div></td>
          <td data-label="Part #"><div class="skeleton"></div></td>
          <td data-label="Qty" class="qty"><div class="skeleton"></div></td>
          <td data-label="In use"><div class="skeleton"></div></td>
          <td data-label="Location"><div class="skeleton"></div></td>
          <td data-label="Supplier"><div class="skeleton"></div></td>
          <td data-label="Category"><div class="skeleton"></div></td>
        </tr>
        <tr class="loading" aria-hidden="true">
          <td class="name"><div class="with-photo">
            <div class="skeleton row-photo"></div>
            <div><div class="skeleton line" style="width: 65%"></div><div class="tags"><div class="skeleton pill"></div><div class="skeleton pill"></div></div></div>
          </div></td>
          <td data-label="Part #"><div class="skeleton"></div></td>
          <td data-label="Qty" class="qty"><div class="skeleton"></div></td>
          <td data-label="In use"><div class="skeleton"></div></td>
          <td data-label="Location"><div class="skeleton"></div></td>
          <td data-label="Supplier"><div class="skeleton"></div></td>
          <td data-label="Category"><div class="skeleton"></div></td>
        </tr></tbody>
          </table>
        </main>
    </div>
    <dialog id="ask"></dialog>
    <div id="switching" data-app="inventory" aria-hidden="true"><img src="loading.svg" alt="" /><p><span class="name">FTC Ultimate</span><span class="app-name">Inventory</span></p></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
