.right{animation:split-right .8s infinite}@keyframes split-right{0%{transform:none;animation-timing-function:ease-out}25%{transform:translate(41.8px,24.0px);animation-timing-function:cubic-bezier(.3,1.5,.6,1)}62.5%,100%{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.new{display:none}}
