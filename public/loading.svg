<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><style>
.layer{transform-origin:256px 256px;animation:.8s infinite cubic-bezier(.4,0,.2,1)}
.old{animation-name:turn-out}.new{animation-name:turn-in}
@keyframes turn-out{0%{transform:rotate(0deg)}62.5%,100%{transform:rotate(120deg)}}
@keyframes turn-in{0%{transform:rotate(-120deg);opacity:0}62.5%,100%{transform:rotate(0deg);opacity:1}}
.glyph{animation:.8s infinite linear}.old .glyph{animation-name:glyph-out}.new .glyph{animation-name:glyph-in}
@keyframes glyph-out{0%{opacity:1}18.75%,100%{opacity:0}}
@keyframes glyph-in{0%,21.9%{opacity:0}62.5%,100%{opacity:1}}
.top{animation:split-top .8s infinite}@keyframes split-top{0%{transform:none;animation-timing-function:ease-out}25%{transform:translate(0.0px,-48.0px);animation-timing-function:cubic-bezier(.3,1.5,.6,1)}62.5%,100%{transform:none}}
