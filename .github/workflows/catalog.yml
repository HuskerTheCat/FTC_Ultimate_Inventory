name: Update part catalog

# Rebuilds src/catalog.json (the supplier parts the scanner recognizes) from the suppliers' stores.
# Runs on the 1st of each month, or from the Actions tab ("Update part catalog" -> "Run workflow").
on:
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/build-catalog.mjs
      - name: Save the catalog if it changed
        id: save
        run: |
          git add src/catalog.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update part catalog"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Commits made by a workflow don't start other workflows, so publish the website explicitly.
      - if: steps.save.outputs.changed && github.ref == 'refs/heads/main'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
