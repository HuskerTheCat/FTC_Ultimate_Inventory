name: Build apps

# Run from the Actions tab ("Build apps" -> "Run workflow") to build the Windows installer
# and Android APK and publish them as a GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number, e.g. 0.2.0
        required: true

permissions:
  contents: read

jobs:
  # The release notes are the version's section of WHATS-NEW.md. Checked first, so a missing section stops the run
  # before the long builds.
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          awk -v v="## v$VERSION" 'index($0, v " ") == 1 || $0 == v { on = 1; next } /^## / { on = 0 } on' WHATS-NEW.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "WHATS-NEW.md has no '## v$VERSION' section. Rename 'Next update' to 'v$VERSION · <date>' first."; exit 1; }
        env:
          VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  windows:
    needs: notes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm pkg set "version=$VERSION"
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
      - run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/FTC-Ultimate-Inventory-Setup.exe

  android:
    needs: notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm pkg set "version=$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - run: npm run build:android
      # Every release is signed with the same key (repo secrets), so each APK installs as an update over the last.
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE" && test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE or ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          cd android && ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=release \
            -Pandroid.injected.signing.key.password="$ANDROID_KEYSTORE_PASSWORD"
      - run: mv android/app/build/outputs/apk/release/app-release.apk FTC-Ultimate-Inventory.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: FTC-Ultimate-Inventory.apk

  release:
    needs: [notes, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: |
            FTC-Ultimate-Inventory-Setup.exe
            FTC-Ultimate-Inventory.apk
